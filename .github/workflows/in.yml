name: Windows Web Desktop (Rock-Solid + Telegram)

on:
  workflow_dispatch:

jobs:
  launch-windows:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Setup VNC & Dependencies
        shell: powershell
        run: |
          Write-Host "Configuring Windows Environment..." -ForegroundColor Cyan

          Set-DisplayResolution -Width 1280 -Height 720 -Force -ErrorAction SilentlyContinue
          powercfg /s 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c

          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'UserPreferencesMask' -Value ([byte[]](0x90,0x12,0x03,0x80,0x10,0x00,0x00,0x00))
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop\WindowMetrics' -Name 'MinAnimate' -Value 0

          choco install tightvnc -y --no-progress
          Stop-Service tvnserver -ErrorAction SilentlyContinue

          $vncPaths = @("HKLM:\SOFTWARE\TightVNC\Server", "HKCU:\Software\TightVNC\Server")
          foreach ($path in $vncPaths) {
              if (-not (Test-Path $path)) { New-Item -Path $path -Force | Out-Null }
              Set-ItemProperty -Path $path -Name "AcceptRfbConnections" -Value 1 -Type DWord
              Set-ItemProperty -Path $path -Name "AllowLoopback" -Value 1 -Type DWord
              Set-ItemProperty -Path $path -Name "LoopbackOnly" -Value 0 -Type DWord
              Set-ItemProperty -Path $path -Name "UseVncAuthentication" -Value 0 -Type DWord
              Set-ItemProperty -Path $path -Name "AlwaysShared" -Value 1 -Type DWord
              Set-ItemProperty -Path $path -Name "DisconnectAction" -Value 0 -Type DWord
              Set-ItemProperty -Path $path -Name "RemoveWallpaper" -Value 0 -Type DWord
          }

          Start-Service tvnserver

          git clone --depth 1 https://github.com/novnc/noVNC.git C:\noVNC
          pip install websockify

          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe"

      - name: 2. Start Web Bridge & Launch Foreground Tunnel
        shell: powershell
        run: |
          # 1. Create Websockify script
          @'
          while ($true) {
              python -m websockify --web C:\noVNC --heartbeat 15 8080 127.0.0.1:5900
              Start-Sleep -Seconds 1
          }
          '@ | Set-Content -Path "ws.ps1" -Encoding UTF8

          # 2. Create Telegram Dispatcher script
          @'
          $bot = "8608061868:AAHEEsZPOw8vq100WyyusF3QjTlBvTq9-Iw"
          $chat = "7963634461"
          for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 1
              if (Test-Path "cf.log") {
                  $content = Get-Content "cf.log" -Raw -ErrorAction SilentlyContinue
                  if ($content -match "https://[a-zA-Z0-9-]+\.trycloudflare\.com") {
                      $url = $matches[0] + "/vnc.html?autoconnect=true&reconnect=true&resize=scale"
                      $msg = "Windows Desktop Ready!`n`nLink:`n" + $url
                      $payload = @{ chat_id = $chat; text = $msg } | ConvertTo-Json
                      try {
                          Invoke-RestMethod -Uri "https://api.telegram.org/bot$bot/sendMessage" -Method Post -ContentType "application/json" -Body $payload -TimeoutSec 10 | Out-Null
                      } catch {}
                      break
                  }
              }
          }
          '@ | Set-Content -Path "tg.ps1" -Encoding UTF8

          # Start background jobs
          Start-Process powershell -ArgumentList "-WindowStyle Hidden -ExecutionPolicy Bypass -File ws.ps1"
          Start-Process powershell -ArgumentList "-WindowStyle Hidden -ExecutionPolicy Bypass -File tg.ps1"

          Write-Host "==========================================================" -ForegroundColor Green
          Write-Host "Starting Cloudflare Tunnel directly in Foreground..." -ForegroundColor Yellow
          Write-Host "==========================================================" -ForegroundColor Green

          # Run cloudflared directly (Primary Foreground Process)
          .\cloudflared.exe tunnel --url http://127.0.0.1:8080 --logfile cf.log --no-autoupdate
