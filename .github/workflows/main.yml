name: Windows Web Desktop (Cloudflare)

on:
  workflow_dispatch:

jobs:
  launch-windows:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Setup VNC Server & Dependencies
        shell: powershell
        run: |
          Write-Host "Installing TightVNC..." -ForegroundColor Cyan
          choco install tightvnc -y --no-progress

          New-Item -Path "HKLM:\SOFTWARE\TightVNC\Server" -Force | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\TightVNC\Server" -Name "AcceptRfbConnections" -Value 1 -Type DWord
          Set-ItemProperty -Path "HKLM:\SOFTWARE\TightVNC\Server" -Name "AllowLoopback" -Value 1 -Type DWord
          Set-ItemProperty -Path "HKLM:\SOFTWARE\TightVNC\Server" -Name "UseVncAuthentication" -Value 0 -Type DWord

          Start-Process "C:\Program Files\TightVNC\tvnserver.exe" -ArgumentList "-start"

          git clone --depth 1 https://github.com/novnc/noVNC.git C:\noVNC
          pip install websockify

          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe"

      - name: 2. Start Web Bridge & Cloudflare Tunnel
        shell: powershell
        run: |
          Start-Process powershell -ArgumentList "-NoExit", "-Command", "websockify --web C:\noVNC 8080 localhost:5900"

          Write-Host "==========================================================" -ForegroundColor Green
          Write-Host "Server is ready! Look for the trycloudflare URL below." -ForegroundColor Yellow
          Write-Host "URL Format: https://xxxx.trycloudflare.com/vnc.html?autoconnect=true" -ForegroundColor Yellow
          Write-Host "==========================================================" -ForegroundColor Green

          .\cloudflared.exe tunnel --url http://localhost:8080
