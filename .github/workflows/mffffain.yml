name: Windows Web Desktop (Telegram & Auto-Healing)

on:
  workflow_dispatch:

jobs:
  launch-windows:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Setup Environment & Dependencies
        shell: powershell
        run: |
          Write-Host "Configuring System & Display..." -ForegroundColor Cyan

          # بهینه‌سازی گرافیک و برق سرور
          Set-DisplayResolution -Width 1280 -Height 720 -Force -ErrorAction SilentlyContinue
          powercfg /s 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c

          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'UserPreferencesMask' -Value ([byte[]](0x90,0x12,0x03,0x80,0x10,0x00,0x00,0x00))
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop\WindowMetrics' -Name 'MinAnimate' -Value 0

          # نصب TightVNC
          choco install tightvnc -y --no-progress
          Stop-Service tvnserver -ErrorAction SilentlyContinue

          # رجیستری برای نشست دائم
          $vncPaths = @("HKLM:\SOFTWARE\TightVNC\Server", "HKCU:\Software\TightVNC\Server")
          foreach ($path in $vncPaths) {
              if (-not (Test-Path $path)) { New-Item -Path $path -Force | Out-Null }
              Set-ItemProperty -Path $path -Name "AcceptRfbConnections" -Value 1 -Type DWord
              Set-ItemProperty -Path $path -Name "AllowLoopback" -Value 1 -Type DWord
              Set-ItemProperty -Path $path -Name "LoopbackOnly" -Value 0 -Type DWord
              Set-ItemProperty -Path $path -Name "UseVncAuthentication" -Value 0 -Type DWord
              Set-ItemProperty -Path $path -Name "AlwaysShared" -Value 1 -Type DWord
              Set-ItemProperty -Path $path -Name "DisconnectAction" -Value 0 -Type DWord
              Set-ItemProperty -Path $path -Name "RemoveWallpaper" -Value 0 -Type DWord
              Set-ItemProperty -Path $path -Name "PollFullScreen" -Value 1 -Type DWord
          }

          Start-Service tvnserver

          # نصب noVNC و پکیج‌ها
          git clone --depth 1 https://github.com/novnc/noVNC.git C:\noVNC
          pip install websockify requests psutil

          # نمایشگر پینگ آنلاین
          $hudScript = @'
          <div id='pingHUD' style='position:fixed;top:10px;right:10px;background:rgba(0,0,0,0.75);color:#00ff66;font-family:monospace;padding:6px 12px;border-radius:6px;font-size:13px;z-index:9999;border:1px solid #00ff66;pointer-events:none;'>Ping: Measuring...</div>
          <script>
            setInterval(function(){
              var start = Date.now();
              fetch('/ping_check', {cache: 'no-store'}).then(function(){
                var rtt = Date.now() - start;
                var el = document.getElementById('pingHUD');
                if(el){
                  el.innerText = '⚡ Ping: ' + rtt + ' ms | Low-Latency';
                  el.style.color = rtt < 120 ? '#00ff66' : (rtt < 250 ? '#ffcc00' : '#ff4444');
                }
              }).catch(function(){});
            }, 2000);
          </script>
          '@
          Add-Content -Path "C:\noVNC\vnc.html" -Value $hudScript

          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe"

      - name: 2. Launch Telegram Bot Orchestrator & Auto-Healer
        shell: powershell
        run: |
          $pythonScript = @'
          import subprocess
          import time
          import re
          import os
          import threading
          import requests
          import psutil

          BOT_TOKEN = "8608061868:AAHEEsZPOw8vq100WyyusF3QjTlBvTq9-Iw"
          ADMIN_ID = 7963634461
          BASE_URL = f"https://api.telegram.org/bot{BOT_TOKEN}"

          tunnel_process = None
          current_url = ""
          last_update_id = 0
          log_file_handle = None

          def send_telegram(text):
              try:
                  url = f"{BASE_URL}/sendMessage"
                  payload = {"chat_id": ADMIN_ID, "text": text, "parse_mode": "HTML"}
                  requests.post(url, json=payload, timeout=10)
              except Exception as e:
                  print("Telegram send error:", e)

          def start_websockify():
              subprocess.Popen(["python", "-m", "websockify", "--web", "C:\\noVNC", "--heartbeat", "15", "8080", "127.0.0.1:5900"],
                               stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)

          def start_cloudflared():
              global tunnel_process, current_url, log_file_handle
              if tunnel_process:
                  try:
                      tunnel_process.kill()
                  except:
                      pass
              if log_file_handle:
                  try:
                      log_file_handle.close()
                  except:
                      pass

              log_file_handle = open("cloudflared.log", "w+", encoding="utf-8")
              tunnel_process = subprocess.Popen(
                  ["cloudflared.exe", "tunnel", "--url", "http://127.0.0.1:8080", "--no-autoupdate"],
                  stdout=log_file_handle,
                  stderr=subprocess.STDOUT
              )

              # مانیتور لاگ تا زمان دریافت لینک
              for _ in range(60):
                  time.sleep(1)
                  if os.path.exists("cloudflared.log"):
                      with open("cloudflared.log", "r", encoding="utf-8", errors="ignore") as f:
                          content = f.read()
                          match = re.search(r'https://[a-zA-Z0-9-]+\.trycloudflare\.com', content)
                          if match:
                              raw_url = match.group(0)
                              current_url = f"{raw_url}/vnc.html?autoconnect=true&reconnect=true&quality=4&compression=6&resize=scale"
                              print("Found Tunnel URL:", current_url)
                              msg = (
                                  "🚀 <b>Windows Web Desktop is Ready!</b>\n\n"
                                  f"🔗 <b>Access Link:</b>\n{current_url}\n\n"
                                  "⚙️ <b>Specs:</b>\n"
                                  f"• CPU Cores: {os.cpu_count()}\n"
                                  f"• RAM: {round(psutil.virtual_memory().total / (1024**3), 1)} GB\n"
                                  f"• OS: Windows Server (GitHub Runner)\n\n"
                                  "🎮 <b>Commands:</b>\n"
                                  "/link - Get Access Link\n"
                                  "/status - Server Resources & Uptime\n"
                                  "/newlink - Generate New Tunnel\n"
                                  "/restart_vnc - Restart Desktop Service"
                              )
                              send_telegram(msg)
                              return
              send_telegram("❌ Failed to start Cloudflare Tunnel. Retrying...")

          def telegram_listener():
              global last_update_id, current_url
              while True:
                  try:
                      url = f"{BASE_URL}/getUpdates?offset={last_update_id + 1}&timeout=20"
                      resp = requests.get(url, timeout=25).json()
                      if "result" in resp:
                          for update in resp["result"]:
                              last_update_id = update["update_id"]
                              if "message" in update and "text" in update["message"]:
                                  chat_id = update["message"]["chat"]["id"]
                                  if chat_id != ADMIN_ID:
                                      continue
                                  text = update["message"]["text"].strip().lower()

                                  if text in ["/start", "/link"]:
                                      send_telegram(f"🔗 <b>Access Link:</b>\n{current_url}")
                                  elif text == "/status":
                                      ram = psutil.virtual_memory()
                                      cpu = psutil.cpu_percent(interval=0.5)
                                      stat_msg = (
                                          "📊 <b>Live Server Status:</b>\n\n"
                                          f"⚡ CPU Usage: {cpu}%\n"
                                          f"🧠 RAM Usage: {ram.percent}% ({round(ram.used/(1024**3),1)}/{round(ram.total/(1024**3),1)} GB)\n"
                                          f"🟢 Tunnel Active: {'Yes' if current_url else 'No'}\n"
                                          f"⏱ Session: Persistent & Isolated"
                                      )
                                      send_telegram(stat_msg)
                                  elif text == "/newlink":
                                      send_telegram("🔄 Generating a new Cloudflare tunnel...")
                                      threading.Thread(target=start_cloudflared).start()
                                  elif text == "/restart_vnc":
                                      send_telegram("🔄 Restarting VNC Service...")
                                      subprocess.run(["powershell", "-Command", "Restart-Service tvnserver"])
                                      start_websockify()
                                      send_telegram("✅ Desktop service restarted successfully.")
                  except Exception as e:
                      time.sleep(2)

          def watchdog():
              global tunnel_process
              while True:
                  time.sleep(15)
                  try:
                      requests.get("http://127.0.0.1:8080/vnc.html", timeout=3)
                  except:
                      start_websockify()

                  if tunnel_process and tunnel_process.poll() is not None:
                      send_telegram("⚠️ Tunnel disconnected. Auto-healing...")
                      start_cloudflared()

          start_websockify()
          start_cloudflared()
          threading.Thread(target=telegram_listener, daemon=True).start()
          watchdog()
          '@

          [System.IO.File]::WriteAllText("$PWD\orchestrator.py", $pythonScript, [System.Text.Encoding]::UTF8)
          python orchestrator.py
